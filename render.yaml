services:
  - type: web
    name: gestion-academica
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-academica-db
          property: connectionString

databases:
  - name: gestion-academica-db
    plan: free
    databaseName: academica
    user: admin
